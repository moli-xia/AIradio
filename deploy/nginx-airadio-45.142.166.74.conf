server
{
    listen 80;
    server_name 45.142.166.74;
    index index.html;
    root /www/wwwroot/airadio/dist;

    error_page 502 /502.html;

    location / {
        proxy_pass http://127.0.0.1:4177;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        send_timeout 900s;
    }

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.agents|\.codex|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ~ \.well-known {
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    access_log /www/wwwlogs/airadio-45.142.166.74.log;
    error_log /www/wwwlogs/airadio-45.142.166.74.error.log;
}
